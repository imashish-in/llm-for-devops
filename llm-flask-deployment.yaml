apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-model-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-flask
  template:
    metadata:
      labels:
        app: llm-flask
    spec:
      containers:
      - name: llm-flask
        image: ashishsoldy/llm-flask:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "2000m"
        volumeMounts:
        - name: model-cache
          mountPath: /app/model_cache
        env:
        - name: TRANSFORMERS_CACHE
          value: "/app/model_cache"
        - name: HF_HOME
          value: "/app/model_cache"
        - name: TORCH_HOME
          value: "/app/model_cache"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm-flask-service
spec:
  type: ClusterIP
  selector:
    app: llm-flask
  ports:
  - port: 8080
    targetPort: 8080
