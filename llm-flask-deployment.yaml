apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-flask
  template:
    metadata:
      labels:
        app: llm-flask
    spec:
      containers:
      - name: llm-flask
        image: ashishsoldy/llm-flask:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-flask-service
spec:
  type: ClusterIP
  selector:
    app: llm-flask
  ports:
  - port: 8080
    targetPort: 8080
